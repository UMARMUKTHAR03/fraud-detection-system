services:
  - type: web
    name: fraudguard-ai-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn src.api.fraud_api:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: PYTHONPATH
        value: .
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: ALLOWED_ORIGINS
        value: "https://umarmukthar03.github.io,http://localhost:3000,http://localhost:8000,http://127.0.0.1:5500"
    disk:
      name: fraudguard-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
