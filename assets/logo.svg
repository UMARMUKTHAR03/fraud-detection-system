<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="60%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shield-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="shield-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>

    <!-- Neural Signal Gradient -->
    <linearGradient id="signal-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="40" fill="url(#bg-glow)" />

  <!-- Outer Ambient Shield Glow -->
  <path d="M 250 48 
           C 345 48, 415 85, 415 158 
           C 415 285, 335 390, 250 452 
           C 165 390, 85 285, 85 158 
           C 85 85, 155 48, 250 48 Z" 
        fill="none" 
        stroke="#0284c7" 
        stroke-width="12" 
        stroke-opacity="0.25" 
        filter="url(#soft-glow)" />

  <!-- Main Shield Body -->
  <path d="M 250 54 
           C 340 54, 405 90, 405 160 
           C 405 280, 330 380, 250 440 
           C 170 380, 95 280, 95 160 
           C 95 90, 160 54, 250 54 Z" 
        fill="url(#shield-fill)" 
        stroke="url(#shield-border)" 
        stroke-width="6" />

  <!-- Shield Inner Bevel Line -->
  <path d="M 250 72 
           C 325 72, 380 102, 380 165 
           C 380 268, 316 356, 250 410 
           C 184 356, 120 268, 120 165 
           C 120 102, 175 72, 250 72 Z" 
        fill="none" 
        stroke="#1e293b" 
        stroke-width="2" />

  <!-- Central Neural AI Nodes & Circuit Grid -->
  <g opacity="0.45" stroke="#38bdf8" stroke-width="1.5">
    <line x1="250" y1="120" x2="190" y2="180" />
    <line x1="250" y1="120" x2="310" y2="180" />
    <line x1="190" y1="180" x2="190" y2="270" />
    <line x1="310" y1="180" x2="310" y2="270" />
    <line x1="190" y1="270" x2="250" y2="330" />
    <line x1="310" y1="270" x2="250" y2="330" />
    <line x1="190" y1="180" x2="310" y2="180" stroke-dasharray="4 4" />
    <line x1="190" y1="270" x2="310" y2="270" stroke-dasharray="4 4" />
  </g>

  <!-- Financial Transaction Signal / Telemetry Waveform -->
  <path d="M 140 240 
           L 190 240 
           L 215 170 
           L 245 305 
           L 275 205 
           L 295 255 
           L 320 240 
           L 360 240" 
        fill="none" 
        stroke="url(#signal-grad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#core-glow)" />

  <!-- Neural Nodes (Circles) -->
  <circle cx="250" cy="120" r="6" fill="#38bdf8" filter="url(#core-glow)" />
  <circle cx="190" cy="180" r="5" fill="#06b6d4" />
  <circle cx="310" cy="180" r="5" fill="#06b6d4" />
  <circle cx="215" cy="170" r="6.5" fill="#38bdf8" filter="url(#core-glow)" />
  <circle cx="245" cy="305" r="7.5" fill="#ef4444" filter="url(#core-glow)" />
  <circle cx="275" cy="205" r="6" fill="#06b6d4" />
  <circle cx="190" cy="270" r="5" fill="#0284c7" />
  <circle cx="310" cy="270" r="5" fill="#0284c7" />
  <circle cx="250" cy="330" r="6" fill="#10b981" filter="url(#core-glow)" />

  <!-- Shield Crest Lock Indicator -->
  <g transform="translate(236, 360)">
    <rect x="3" y="10" width="22" height="16" rx="3" fill="#38bdf8" />
    <path d="M 7 10 V 6 A 7 7 0 0 1 21 6 V 10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="14" cy="17" r="2" fill="#0b1329" />
    <line x1="14" y1="19" x2="14" y2="22" stroke="#0b1329" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>

